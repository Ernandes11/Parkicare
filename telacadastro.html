<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crie sua conta</title>
  <link rel="stylesheet" href="telacadastro.css">
  <link rel="stylesheet" href="accessibility.css">
</head>

<body>
  <div class="container">
    <div class="form-box">
      <h1>Crie a sua conta</h1>
      <p>Crie a sua conta para iniciarmos essa jornada!</p>

      <form id="registerForm" novalidate>
        <div class="input-group">
          <input type="text" id="nome" name="nome" placeholder="Nome completo" required autocomplete="name">
          <p class="error-text" id="nome-error" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <input type="email" id="email" name="email" placeholder="Email" required autocomplete="email">
          <p class="error-text" id="email-error" aria-live="polite"></p>
        </div>

        <div class="password-field input-group">
          <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="new-password">
          <p class="error-text" id="senha-error" aria-live="polite"></p>
        </div>

        <!-- Confirmar senha -->
        <div class="password-field input-group">
          <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar senha" required
            autocomplete="new-password">
          <p class="error-text" id="confirmar-senha-error" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <input type="tel" id="whatsapp" name="whatsapp" placeholder="Número de emergência (Whatsapp)" required
            autocomplete="tel" pattern="[0-9]{10,11}" title="O número deve ter 10 ou 11 dígitos, apenas números.">
          <p class="error-text" id="whatsapp-error" aria-live="polite"></p>
        </div>

        <!-- Segundo número de emergência -->
        <div class="input-group">
          <input type="tel" id="whatsapp2" name="whatsapp2" placeholder="Segundo número de emergência (Opcional)"
            autocomplete="tel" pattern="[0-9]{10,11}" title="O número deve ter 10 ou 11 dígitos, apenas números.">
          <p class="error-text" id="whatsapp2-error" aria-live="polite"></p>
        </div>

        <button type="submit">Vamos começar!</button>

        <p style="text-align: center; margin-top: 15px; font-size: 14px;">
          Já tem uma conta? <a href="telalogin.html"
            style="color: #6C63FF; text-decoration: none; font-weight: bold;">Entre aqui</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Supabase & Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="telacadastro.js"></script>
</body>

</html>
