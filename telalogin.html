<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParkiCare</title>
    <link rel="stylesheet" href="css/telacadastro.css?v=2">
    <link rel="stylesheet" href="css/accessibility.css">
    <script src="js/accessibility-loader.js"></script>
</head>

<body>
  <div class="container">
    <div class="form-box">
      <h1 class="main-title">Bem-vindo de volta!</h1>
      <p class="sub-title">Entre na sua conta para continuar.</p>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="" required autocomplete="email">
          <p class="error-text" id="email-error" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <div class="pill-input-wrapper">
            <input type="password" id="senha" name="senha" placeholder="" required autocomplete="current-password">
            <div class="eye-toggle" id="toggleSenha"></div>
          </div>
          <p class="error-text" id="senha-error" aria-live="polite"></p>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn-primary">Entrar</button>
          <p class="login-link">
            Não tem uma conta? <a href="telacadastro.html">Cadastre-se</a>
          </p>
        </div>
      </form>
    </div>
  </div>

    <!-- Supabase & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/telalogin.js"></script>
</body>

</html>
