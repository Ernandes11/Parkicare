<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkiCare - Cadastrar Medicamento</title>
    <link rel="stylesheet" href="css/telamedicamento.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/accessibility.css">
    <script src="js/accessibility-loader.js"></script>
</head>

<body>
    <div class="container main-card-layout">
        <div class="registration-card">
            <header class="card-header">
                <a href="telainicial.html" class="close-btn">
                    <img src="assets/img/excluir (1).png" alt="Fechar">
                </a>
                <h1 class="card-title">Cadastrar medicamento</h1>
            </header>

            <form id="medicamento-form">
                <div class="input-section">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Ex: Levodopa" required>
                </div>

                <div class="input-section">
                    <label for="dosagem">Dosagem</label>
                    <input type="text" id="dosagem" placeholder="Ex: 100mg" required>
                </div>

                <div class="input-section">
                    <label for="horario">Horários</label>
                    <input type="time" id="horario" required>
                </div>

                <div class="action-section">
                    <button type="submit" class="btn-register">Cadastrar</button>
                </div>
            </form>

            <div class="bottom-actions">
                <button type="button" class="btn-export export-button">Exportar relatorio</button>
            </div>
        </div>
    </div>

    <!-- Supabase & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/telamedicamento.js"></script>
    <script src="js/configs.js"></script>
</body>

</html>
