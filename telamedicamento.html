<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkiCare - Cadastrar Medicamento</title>
    <link rel="stylesheet" href="telamedicamento.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <img src="logoParkicare.png.png" alt="Logo ParkiCare - Mão">
                </div>
                <div class="title-container">
                    <h1>ParkiCare</h1>
                    <p>Pequenos passos, grandes cuidados.</p>
                </div>
            </div>
            <a href="telainicial.html" class="back-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#FFFFFF">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </a>
        </header>

        <button class="export-button">exportar relatório</button>

        <div class="card">
            <h2>Cadastrar novo medicamento</h2>
            <form id="medicamento-form">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Insira o nome do medicamento">
                </div>
                <div class="form-group">
                    <label for="dataInicio">Data de Início:</label>
                    <input type="date" id="dataInicio">
                </div>
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="horario">Horário:</label>
                        <input type="time" id="horario">
                    </div>
                    <div class="form-group half-width">
                        <label for="intervalo">Intervalo:</label>
                        <select id="intervalo">
                            <option value="1">Diário</option>
                            <option value="12">12 horas</option>
                            <option value="8">8 horas</option>
                            <option value="6">6 horas</option>
                            <option value="4">4 horas</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group half-width">
                        <label for="dosagem">Dosagem:</label>
                        <div class="input-with-select">
                            <input type="text" id="dosagem" placeholder="Ex: 50">
                            <select id="unidade">
                                <option value="mg">mg</option>
                                <option value="ml">ml</option>
                                <option value="CP">CP</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button type="submit" class="submit-button">Cadastrar</button>
            </form>
        </div>
    </div>

    <!-- Supabase & Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="telamedicamento.js"></script>
</body>

</html>
