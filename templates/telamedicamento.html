<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkiCare - Medicamentos</title>
    <link rel="stylesheet" href="/static/css/telamedicamento.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/accessibility.css">
    <script src="/static/js/accessibility-loader.js"></script>
</head>

<body>
    <div class="container main-card-layout">
        <div class="top-nav">
            <a href="/inicial" class="back-link">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Voltar
            </a>
        </div>
        <!-- Header Section -->
        <header class="page-header" id="page-header">
            <div class="header-title">
                <img src="/static/img/icone_medicamentos_novo.png" alt="Ícone Medicamentos" width="28" height="28" style="object-fit: contain;">
                <h1>Medicamentos</h1>
            </div>
            <p class="subtitle">Gerencie suas medicações</p>
        </header>

        <!-- Empty State View -->
        <div id="empty-state-view" class="view-section" style="display: none;">
            <button class="btn-primary-large btn-new-med">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Novo Medicamento
            </button>
            <div class="empty-content">
                <div class="empty-icon-wrapper">
                    <img src="/static/img/icone_medicamentos_novo.png" alt="Nenhum medicamento" width="64" height="64" style="opacity: 0.6; object-fit: contain;" class="rotated-pill">
                </div>
                <h2>Nenhum medicamento cadastrado</h2>
                <p>Clique em "Novo Medicamento" para começar</p>
            </div>
        </div>

        <!-- List View -->
        <div id="list-view" class="view-section" style="display: none;">
            <div class="top-actions-row">
                <button class="btn-primary-half btn-new-med">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Novo Medicamento
                </button>
                <button class="btn-danger-half btn-export">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Exportar Relatório
                </button>
            </div>

            <div class="list-section">
                <h3 id="list-title">Medicamentos Cadastrados (0)</h3>
                <div id="med-list-container">
                    <!-- Med Cards will be injected here via JS -->
                </div>
            </div>
        </div>

        <!-- Form View -->
        <div id="form-view" class="view-section" style="display: none;">
            <div class="registration-card">
                <div class="form-header-row">
                    <h2 class="card-title-teal">Adicionar Medicamento</h2>
                    <button class="btn-cancel" id="btn-cancel-form" title="Cancelar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                
                <form id="medicamento-form">
                    <div class="input-section">
                        <label for="nome">Nome do Medicamento</label>
                        <input type="text" id="nome" placeholder="Ex: Levodopa" required>
                    </div>

                    <div class="input-section">
                        <label for="dosagem">Dosagem</label>
                        <input type="text" id="dosagem" placeholder="Ex: 100mg" required>
                    </div>

                    <div class="input-section">
                        <label for="horario">Horário</label>
                        <div class="input-wrapper">
                            <input type="time" id="horario" required>
                            <div class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="action-section">
                        <button type="submit" class="btn-register">Salvar Medicamento</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Template for Med Card -->
    <template id="med-card-template">
        <div class="med-card">
            <div class="med-info">
                <div class="med-header-row">
                    <h4 class="med-name"></h4>
                    <button class="btn-delete" title="Excluir">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                </div>
                <div class="med-detail">
                    <img src="/static/img/icone_medicamentos_novo.png" alt="Ícone" width="16" height="16" style="object-fit: contain;">
                    Dosagem: <span class="med-dosagem"></span>
                </div>
                <div class="med-detail">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#45a081" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    Horário: <span class="med-horario"></span>
                </div>
            </div>
        </div>
    </template>

    <script src="/static/js/telamedicamento.js"></script>
</body>

</html>
