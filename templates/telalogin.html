<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ParkiCare</title>
    <link rel="stylesheet" href="/static/css/telacadastro.css">
    <link rel="stylesheet" href="/static/css/accessibility.css">
    <script src="/static/js/accessibility-loader.js"></script>
</head>

<body>
  <div class="container">
    
    <div class="logo-area">
        <img src="/static/img/logoParkicare.png" alt="Logo ParkiCare" class="logo">
        <h1 class="titulo"><span>Parki</span><span class="care">Care</span></h1>
        <p class="slogan">Pequenos passos, grandes cuidados.</p>
    </div>

    <div class="form-box">
      <h2 class="main-title">Bem-vindo de volta</h2>

      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email">
          <p class="error-text" id="email-error" aria-live="polite"></p>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <div class="pill-input-wrapper">
            <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password">
            <div class="eye-toggle" id="toggleSenha"></div>
          </div>
          <p class="error-text" id="senha-error" aria-live="polite"></p>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn-primary btn-login">Entrar</button>
          <p class="login-link register-link">
            <a href="/cadastro">Não tem conta? Cadastre-se</a>
          </p>
        </div>
      </form>
    </div>
  </div>
    
  <script src="/static/js/telalogin.js"></script>
</body>

</html>
